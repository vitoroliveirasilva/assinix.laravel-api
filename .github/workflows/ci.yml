name: CI

on:
  push:
    branches:
      - prod
      - main
      - dev
  pull_request:
    branches:
      - prod
      - main
      - dev

permissions:
  contents: read

jobs:
  quality:
    name: Tests, Pint, Larastan and OpenAPI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: assinix_test
          POSTGRES_USER: assinix
          POSTGRES_PASSWORD: assinix
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U assinix -d assinix_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_NAME: Assinix
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: true
      APP_URL: http://localhost

      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: pt_BR
      APP_FAKER_LOCALE: pt_BR

      LOG_CHANNEL: stderr
      LOG_LEVEL: debug

      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: assinix_test
      DB_USERNAME: assinix
      DB_PASSWORD: assinix

      CACHE_STORE: redis
      CACHE_PREFIX: assinix_ci_cache
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PASSWORD: null
      REDIS_PORT: 6379

      MAIL_MAILER: array

      AUTH_LOGIN_MAX_ATTEMPTS: 5
      AUTH_LOGIN_IP_MAX_ATTEMPTS: 20
      AUTH_REGISTER_MAX_ATTEMPTS: 5
      AUTH_API_MAX_ATTEMPTS: 120

      AWESOMEAPI_BASE_URL: https://economia.awesomeapi.com.br
      AWESOMEAPI_API_KEY: null
      AWESOMEAPI_TIMEOUT: 1
      AWESOMEAPI_RETRY_TIMES: 0
      AWESOMEAPI_RETRY_SLEEP_MS: 0
      CURRENCY_RATE_CACHE_MINUTES: 60

      API_VERSION: 1.0.0
      SCRAMBLE_API_PATH: api/v1
      SCRAMBLE_API_DOMAIN: null

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, mbstring, pdo_pgsql, pcntl, redis, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --ansi

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      - name: Run migrations
        run: php artisan migrate --force --ansi

      - name: Run tests
        run: composer test

      - name: Check code style with Pint
        run: composer pint:test

      - name: Run static analysis with Larastan
        run: composer analyse

      - name: Export OpenAPI documentation
        run: composer openapi:export

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker Compose file
        run: docker compose config --quiet

      - name: Build application image
        run: docker compose build app