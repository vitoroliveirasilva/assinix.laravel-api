services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: assinix_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - assinix_network

  nginx:
    image: nginx:1.27-alpine
    container_name: assinix_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - assinix_network

  postgres:
    image: postgres:17-alpine
    container_name: assinix_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: assinix
      POSTGRES_USER: assinix
      POSTGRES_PASSWORD: assinix
    volumes:
      - assinix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assinix -d assinix"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - assinix_network

  redis:
    image: redis:7.4-alpine
    container_name: assinix_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - assinix_redis_data:/data
    networks:
      - assinix_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: assinix_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - assinix_network

networks:
  assinix_network:
    driver: bridge

volumes:
  assinix_postgres_data:
  assinix_redis_data: